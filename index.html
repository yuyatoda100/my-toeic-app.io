<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TOEIC単語学習用の4択クイズアプリ。ビジネス文脈の例文付きで効果的に学習できます。">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOEIC単語クイズ">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234f46e5' width='192' height='192'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>TOEIC</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%234f46e5' width='180' height='180'/><text x='50%' y='50%' font-size='90' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>TOEIC</text></svg>">
  
  <title>TOEIC単語学習 4択クイズアプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between py-6 px-4 sm:px-6">

  <!-- アプリヘッダー -->
  <header class="max-w-2xl mx-auto w-full mb-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="showHomeScreen()">
        <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">TOEIC App</span>
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">単語学習4択クイズ</h1>
      </div>
      <div class="flex items-center space-x-3 text-sm font-semibold text-slate-600">
        <div><i class="fa-solid fa-trophy text-amber-500 mr-1"></i>最高スコア: <span id="high-score-val">0</span></div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツカード -->
  <main class="max-w-2xl mx-auto w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden my-auto">

    <!-- 1. ホーム画面 (モード・出題数選択) -->
    <div id="home-screen" class="p-6 sm:p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl mb-1 text-xl">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900">クイズ設定</h2>
        <p class="text-slate-500 text-xs sm:text-sm">学習モードと問題数を選択してスタートしてください。</p>
      </div>

      <!-- 出題数選択（10刻み） -->
      <div class="bg-slate-50 p-4 sm:p-5 rounded-xl border border-slate-200/80 space-y-3">
        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-indigo-600"></i>
          <span>出題数を指定（10刻み）</span>
        </label>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="count-selector-container">
          <!-- JSで10, 20, 30, 40, 50, ALL ボタンを動的生成 -->
        </div>
      </div>

      <!-- モード選択ボタン -->
      <div class="space-y-3 pt-2">
        <button onclick="startQuizWithConfig(false)" class="w-full py-4 px-5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition group flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <i class="fa-solid fa-play text-lg"></i>
            <div class="text-left">
              <div class="text-base leading-tight">通常モードでスタート</div>
              <div class="text-xs text-indigo-200 font-normal mt-0.5">ランダム抽出された問題に挑戦</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right group-hover:translate-x-1 transition-transform"></i>
        </button>

        <button id="home-review-btn" onclick="startQuizWithConfig(true)" class="w-full py-4 px-5 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold rounded-xl shadow-lg shadow-amber-100 transition group flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <div class="text-left">
              <div class="text-base leading-tight">復習モードでスタート</div>
              <div class="text-xs text-amber-100 font-normal mt-0.5">間違えた問題のみを優先出題 (<span id="home-review-count">0</span>問)</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right group-hover:translate-x-1 transition-transform"></i>
        </button>
      </div>

      <!-- 設定・リセットエリア -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>学習データの管理</span>
        <button onclick="resetData()" class="text-rose-600 hover:text-rose-700 font-semibold flex items-center gap-1 hover:underline">
          <i class="fa-solid fa-trash-can"></i> 履歴リセット
        </button>
      </div>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="hidden p-6 sm:p-8">
      <!-- プログレスバー（クイズ画面内） -->
      <div class="mb-6">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-500 mb-1.5">
          <span id="quiz-mode-badge" class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-200">通常モード</span>
          <span id="progress-text">進捗: 0 / 0</span>
        </div>
        <div class="bg-slate-200 rounded-full h-2.5 w-full overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-300 w-0"></div>
        </div>
      </div>

      <!-- 単語表示ヘッダー -->
      <div class="mb-6 text-center border-b border-slate-100 pb-6">
        <div class="flex justify-center items-center gap-2 mb-2">
          <span id="word-pos" class="bg-slate-100 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-md">品詞</span>
          <span id="question-number" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Question 1</span>
        </div>
        <h2 id="target-word" class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight my-2">word</h2>
      </div>

      <!-- 選択肢ボタンエリア -->
      <div id="options-container" class="grid grid-cols-1 gap-3.5 mb-6"></div>

      <!-- 解答後の解説＆例文表示エリア -->
      <div id="explanation-card" class="hidden rounded-xl p-5 mb-6 border transition-all duration-300">
        <div class="flex items-center mb-3">
          <span id="result-badge" class="inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-lg mr-3"></span>
          <h3 id="result-title" class="text-lg font-bold"></h3>
        </div>

        <div class="space-y-3 text-sm">
          <div class="bg-white/80 p-3 rounded-lg border border-slate-200/60 shadow-sm">
            <span class="text-xs font-bold text-slate-500 block uppercase tracking-wider mb-1"><i class="fa-solid fa-book-open mr-1 text-indigo-500"></i>正しい日本語訳</span>
            <p id="correct-meaning" class="text-base font-bold text-slate-900"></p>
          </div>

          <div class="bg-white/80 p-3.5 rounded-lg border border-slate-200/60 shadow-sm">
            <span class="text-xs font-bold text-slate-500 block uppercase tracking-wider mb-1"><i class="fa-solid fa-briefcase mr-1 text-indigo-500"></i>TOEIC ビジネス実用例文</span>
            <p id="example-en" class="font-semibold text-slate-900 mb-1 leading-snug"></p>
            <p id="example-ja" class="text-slate-600 text-xs leading-relaxed"></p>
          </div>

          <div id="business-explanation-box" class="bg-indigo-50/70 p-3.5 rounded-lg border border-indigo-100">
            <span class="text-xs font-bold text-indigo-900 block uppercase tracking-wider mb-1"><i class="fa-solid fa-lightbulb mr-1 text-amber-500"></i>ビジネスシーン補足解説</span>
            <p id="business-explanation" class="text-xs text-indigo-950 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <!-- 次へボタン -->
      <div class="flex justify-between items-center">
        <button onclick="showHomeScreen()" class="text-xs text-slate-400 hover:text-slate-600 font-semibold flex items-center gap-1">
          <i class="fa-solid fa-house"></i> ホームへ戻る
        </button>
        <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition items-center space-x-2">
          <span>次の問題へ</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>

    <!-- 3. 結果サマリー画面 -->
    <div id="summary-screen" class="hidden p-8 text-center">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        <i class="fa-solid fa-flag-checkered"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 mb-1">クイズ終了！</h2>
      <p class="text-slate-500 text-sm mb-6">お疲れ様でした。今回の学習結果です。</p>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
          <span class="text-xs text-slate-500 font-semibold uppercase block mb-1">スコア</span>
          <span id="final-score" class="text-3xl font-black text-indigo-600">0 / 0</span>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
          <span class="text-xs text-slate-500 font-semibold uppercase block mb-1">正答率</span>
          <span id="final-accuracy" class="text-3xl font-black text-emerald-600">0%</span>
        </div>
      </div>

      <div id="review-summary-alert" class="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4 text-xs font-medium mb-6 text-left flex items-start space-x-3">
        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-base mt-0.5"></i>
        <div>
          <span class="font-bold block mb-0.5 text-sm">間違えた単語があります</span>
          <p id="review-count-msg">復習リストに自動登録されました。</p>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="showHomeScreen()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-house"></i>
          <span>ホーム画面へ戻る</span>
        </button>
      </div>
    </div>

  </main>

  <footer class="max-w-2xl mx-auto w-full mt-4 text-center text-xs text-slate-400">
    TOEIC Vocabulary Quiz App
  </footer>
  <script>
    // Service Worker 登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(registration => {
        console.log('Service Worker registered successfully:', registration);
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }

    // TOEIC 頻出単語マスターデータ（ビジネス文脈の例文・解説付き）
const vocabularyData = [
  {
    id: 1,
    word: "company",
    pos: "名詞",
    meaning: "会社、仲間",
    distractors: [
      "同行、同伴",
      "キャンペーン、運動",
      "伴奏、伴奏者"
    ],
    exampleEn: "Our company will launch a new line of eco-friendly office products next month.",
    exampleJa: "当社は来月、環境に配慮した新しいオフィス用品シリーズを発売します。",
    explanation: "TOEICでは「会社」「企業」の意味で最頻出します。形容詞句 in company with (~と一緒に) や、類似スペルの動詞 accompany (～に同行する・添え添える) との区別を注意してください。"
  },
  {
    id: 2,
    word: "refer",
    pos: "動詞",
    meaning: "言及する、参照する",
    distractors: [
      "～をより好む、優先する",
      "～を延期する、後回しにする",
      "～を推論する、推測する"
    ],
    exampleEn: "Please refer to the attached user manual for detailed installation instructions.",
    exampleJa: "詳細な設置手順については、添付の取扱説明書を参照してください。",
    explanation: "TOEIC Part 5/6/7で必出の他動詞です。「refer to A (Aを参照する、Aに言及する)」の型で頻出します。名詞形 reference (参照、照会) との区別も重要です。"
  },
  {
    id: 3,
    word: "business",
    pos: "名詞",
    meaning: "事業、商売、業務",
    distractors: [
      "多忙、忙しさ",
      "交通の混雑",
      "予算、経費"
    ],
    exampleEn: "The firm plans to expand its catering business to international markets.",
    exampleJa: "その会社はケータリング事業を海外市場へ拡大することを計画しています。",
    explanation: "TOEICでは不可算名詞として「事業・ビジネス」、可算名詞として「店舗・企業」の意味で用いられます。頻出表現に business hours (営業時間) があります。"
  },
  {
    id: 4,
    word: "likely",
    pos: "形容詞",
    meaning: "起こりそうな、可能性が高い",
    distractors: [
      "好ましい、好感の持てる",
      "似ている、同様の",
      "制限された、限定的な"
    ],
    exampleEn: "Board members are likely to approve the proposed merger at tomorrow's meeting.",
    exampleJa: "取締役会のメンバーは明日の会議で提案された合併を承認する可能性が高いです。",
    explanation: "TOEIC Part 5で最も狙われやすい形容詞の一つです。「be likely to do (～しそうである)」の構文で頻出します。"
  },
  {
    id: 5,
    word: "according to",
    pos: "前置詞句",
    meaning: "～によると、～に従って",
    distractors: [
      "～の口座・アカウントの",
      "したがって、それに応じて",
      "～のおかげで、～のために"
    ],
    exampleEn: "According to the latest quarterly financial report, domestic sales increased by 15 percent.",
    exampleJa: "最新の四半期財務報告書によると、国内売上高は15％増加しました。",
    explanation: "TOEIC Part 6/7の文書で根拠を示す際に常連となる前置詞句で、後ろに名詞・名詞句を伴います。"
  },
  {
    id: 6,
    word: "event",
    pos: "名詞",
    meaning: "出来事、行事、イベント",
    distractors: [
      "評価、査定",
      "不測の事態、最終的結果",
      "発明、考案"
    ],
    exampleEn: "The annual networking event will be hosted at the downtown convention center.",
    exampleJa: "年次の交流イベントは、ダウンタウンのコンベンションセンターで開催されます。",
    explanation: "TOEICでは「社内行事」「展示会」「セミナー」などのビジネスイベントを指す言葉として多用されます。"
  },
  {
    id: 7,
    word: "product",
    pos: "名詞",
    meaning: "製品、商品",
    distractors: [
      "生産性、生産力",
      "製造、生産プロセス",
      "予測、見通し"
    ],
    exampleEn: "All products manufactured in this facility undergo rigorous quality testing.",
    exampleJa: "この施設で製造されるすべての製品は、厳格な品質検査を受けます。",
    explanation: "可算名詞で「個々の製品」を表します。TOEICでは不可算名詞の production (生産、製造) や productivity (生産性)、producer (生産者) との品詞の違いが問われます。"
  },
  {
    id: 8,
    word: "information",
    pos: "名詞",
    meaning: "情報",
    distractors: [
      "変形、変貌",
      "形成、結成",
      "情報提供者、告発者"
    ],
    exampleEn: "For additional information regarding employee benefits, please contact the HR department.",
    exampleJa: "従業員の福利厚生に関する追加情報については、人事部にお問い合わせください。",
    explanation: "TOEIC超頻出の「不可算名詞（数えられない名詞）」です。an information や informations とは絶対にならない点が Part 5 の文法問題で狙われます。"
  },
  {
    id: 9,
    word: "make",
    pos: "動詞",
    meaning: "作る、～を～にする、行う",
    distractors: [
      "～にマークをつける、標識をする",
      "～を合体させる、統合する",
      "～を修正する、変更する"
    ],
    exampleEn: "The marketing team needs to make a decision on the promotional budget by Friday.",
    exampleJa: "マーケティングチームは金曜日までに販促予算についての決定を下す必要があります。",
    explanation: "TOEICでは make a decision (決定する)、make a reservation (予約する)、make an effort (努力する) などのコロケーションで頻出します。"
  },
  {
    id: 10,
    word: "if",
    pos: "接続詞",
    meaning: "もし～ならば、～かどうか",
    distractors: [
      "たとえ～だとしても",
      "まるで～であるかのように",
      "～である限りは"
    ],
    exampleEn: "Please inform the receptionist if you require a parking validation stamp.",
    exampleJa: "駐車承認スタンプが必要な場合は、受付係にお知らせください。",
    explanation: "条件を表す副詞節を導く接続詞です。時・条件を表す副詞節内では未来のことでも現在形を用いるというルールが重要です。"
  }
];

    let currentWord = null;
    let currentOptions = [];
    let quizMode = false;
    let reviewMode = false;
    let quizCount = 10;
    let currentQuestionIndex = 0;
    let quizQuestions = [];
    let score = 0;
    let wrongAnswers = [];

    // ローカルストレージキー
    const HIGH_SCORE_KEY = 'toeic_high_score';
    const WRONG_ANSWERS_KEY = 'toeic_wrong_answers';

    // 初期化
    function initApp() {
      loadHighScore();
      initCountSelector();
      loadWrongAnswers();
      updateReviewCount();
    }

    // 出題数セレクタを初期化
    function initCountSelector() {
      const container = document.getElementById('count-selector-container');
      const counts = [10, 20, 30, 40, 50];
      
      counts.forEach(count => {
        const button = document.createElement('button');
        button.className = quizCount === count ? 'px-3 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg' : 'px-3 py-2 bg-white text-slate-700 text-sm font-bold rounded-lg border border-slate-300 hover:border-indigo-400';
        button.textContent = count;
        button.onclick = () => selectCount(count, container);
        container.appendChild(button);
      });

      const allButton = document.createElement('button');
      allButton.className = quizCount === vocabularyData.length ? 'px-3 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg' : 'px-3 py-2 bg-white text-slate-700 text-sm font-bold rounded-lg border border-slate-300 hover:border-indigo-400';
      allButton.textContent = 'ALL';
      allButton.onclick = () => selectCount(vocabularyData.length, container);
      container.appendChild(allButton);
    }

    // 出題数を選択
    function selectCount(count, container) {
      quizCount = count;
      const buttons = container.querySelectorAll('button');
      buttons.forEach((btn, index) => {
        if ((index < 5 && count === [10, 20, 30, 40, 50][index]) || (index === 5 && count === vocabularyData.length)) {
          btn.className = 'px-3 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg';
        } else {
          btn.className = 'px-3 py-2 bg-white text-slate-700 text-sm font-bold rounded-lg border border-slate-300 hover:border-indigo-400';
        }
      });
    }

    // クイズを開始
    function startQuizWithConfig(isReviewMode) {
      reviewMode = isReviewMode;
      quizMode = true;
      
      if (reviewMode && wrongAnswers.length === 0) {
        alert('復習する間違いはまだありません。通常モードで学習してください。');
        return;
      }

      if (reviewMode) {
        quizQuestions = wrongAnswers.slice(0, quizCount);
      } else {
        quizQuestions = shuffleArray(vocabularyData).slice(0, quizCount);
      }

      currentQuestionIndex = 0;
      score = 0;
      showQuizScreen();
      showQuestion();
    }

    // ホーム画面を表示
    function showHomeScreen() {
      document.getElementById('home-screen').classList.remove('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.add('hidden');
      quizMode = false;
    }

    // クイズ画面を表示
    function showQuizScreen() {
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('summary-screen').classList.add('hidden');
      const badge = document.getElementById('quiz-mode-badge');
      badge.textContent = reviewMode ? '復習モード' : '通常モード';
    }

    // 問題を表示
    function showQuestion() {
      if (currentQuestionIndex >= quizQuestions.length) {
        showSummary();
        return;
      }

      currentWord = quizQuestions[currentQuestionIndex];
      document.getElementById('target-word').textContent = currentWord.word;
      document.getElementById('word-pos').textContent = currentWord.pos;
      document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}`;

      const progressPercent = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
      document.getElementById('progress-bar').style.width = progressPercent + '%';
      document.getElementById('progress-text').textContent = `進捗: ${currentQuestionIndex + 1} / ${quizQuestions.length}`;

      generateOptions();
      renderOptions();
      document.getElementById('explanation-card').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');
    }

    // 選択肢を生成
    function generateOptions() {
      const correctAnswer = currentWord.meaning;
      const options = [correctAnswer, ...currentWord.distractors];
      currentOptions = shuffleArray(options);
    }

    // 選択肢をレンダリング
    function renderOptions() {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      
      currentOptions.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'w-full p-4 text-left bg-white border-2 border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition text-slate-800 font-semibold';
        button.textContent = option;
        button.onclick = () => selectAnswer(index, option);
        container.appendChild(button);
      });
    }

    // 答えを選択
    function selectAnswer(index, selectedAnswer) {
      const isCorrect = selectedAnswer === currentWord.meaning;
      if (isCorrect) score++;
      else {
        if (!wrongAnswers.find(w => w.id === currentWord.id)) {
          wrongAnswers.push(currentWord);
        }
      }

      showExplanation(isCorrect);
      disableOptions();
    }

    // 説明を表示
    function showExplanation(isCorrect) {
      const card = document.getElementById('explanation-card');
      const badge = document.getElementById('result-badge');
      const title = document.getElementById('result-title');
      
      if (isCorrect) {
        badge.className = 'inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-lg mr-3 bg-emerald-100 text-emerald-600';
        badge.innerHTML = '<i class="fa-solid fa-check"></i>';
        title.textContent = '正解！';
        card.className = 'rounded-xl p-5 mb-6 border border-emerald-200 bg-emerald-50/50 transition-all duration-300';
      } else {
        badge.className = 'inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-lg mr-3 bg-rose-100 text-rose-600';
        badge.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        title.textContent = '不正解';
        card.className = 'rounded-xl p-5 mb-6 border border-rose-200 bg-rose-50/50 transition-all duration-300';
      }

      document.getElementById('correct-meaning').textContent = currentWord.meaning;
      document.getElementById('example-en').textContent = currentWord.exampleEn;
      document.getElementById('example-ja').textContent = currentWord.exampleJa;
      document.getElementById('business-explanation').textContent = currentWord.explanation;

      card.classList.remove('hidden');
      document.getElementById('next-btn').classList.remove('hidden');
    }

    // 選択肢を無効化
    function disableOptions() {
      const buttons = document.getElementById('options-container').querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
    }

    // 次の問題へ
    function nextQuestion() {
      currentQuestionIndex++;
      showQuestion();
    }

    // 結果サマリーを表示
    function showSummary() {
      saveWrongAnswers();
      const accuracy = Math.round((score / quizQuestions.length) * 100);
      document.getElementById('final-score').textContent = `${score} / ${quizQuestions.length}`;
      document.getElementById('final-accuracy').textContent = `${accuracy}%`;

      if (score > (parseInt(localStorage.getItem(HIGH_SCORE_KEY)) || 0)) {
        localStorage.setItem(HIGH_SCORE_KEY, score);
        loadHighScore();
      }

      const alertBox = document.getElementById('review-summary-alert');
      if (wrongAnswers.length > 0) {
        alertBox.classList.remove('hidden');
        document.getElementById('review-count-msg').textContent = `${wrongAnswers.length}個の単語が復習リストに登録されました。`;
      } else {
        alertBox.classList.add('hidden');
      }

      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');
    }

    // 最高スコアを読み込み
    function loadHighScore() {
      const highScore = localStorage.getItem(HIGH_SCORE_KEY) || 0;
      document.getElementById('high-score-val').textContent = highScore;
    }

    // 間違えた単語を保存
    function saveWrongAnswers() {
      localStorage.setItem(WRONG_ANSWERS_KEY, JSON.stringify(wrongAnswers.map(w => w.id)));
    }

    // 間違えた単語を読み込み
    function loadWrongAnswers() {
      const ids = JSON.parse(localStorage.getItem(WRONG_ANSWERS_KEY) || '[]');
      wrongAnswers = vocabularyData.filter(w => ids.includes(w.id));
    }

    // 復習数を更新
    function updateReviewCount() {
      document.getElementById('home-review-count').textContent = wrongAnswers.length;
    }

    // データをリセット
    function resetData() {
      if (confirm('本当に学習データをリセットしますか？この操作は取り消せません。')) {
        localStorage.removeItem(HIGH_SCORE_KEY);
        localStorage.removeItem(WRONG_ANSWERS_KEY);
        wrongAnswers = [];
        loadHighScore();
        updateReviewCount();
      }
    }

    // 配列をシャッフル
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // アプリ起動時に初期化
    initApp();
  </script>
</body>
</html>
